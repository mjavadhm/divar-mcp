version: '3.8'

services:
  divar-mcp:
    build: .
    container_name: divar-mcp-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
      - HOST=0.0.0.0
      # Optional API key to restrict access:
      # - DIVAR_API_KEY=my_secret_token
      # Public server URL with HTTPS (for ChatGPT Custom Actions / OpenAPI):
      # - SERVER_URL=https://divar-mcp.room237.site
