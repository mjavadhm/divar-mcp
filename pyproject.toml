[project]
name = "divar-yab"
version = "0.1.0"
description = "Divar MCP Server & Smart Ad Hunter"
authors = [{ name = "Javad" }]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.10"

[project.scripts]
divar-mcp = "src.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
